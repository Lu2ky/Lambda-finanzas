name: Deploy Java Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'

      - name: Compilar y empaquetar con Maven
        run: mvn clean package

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 

      - name: Desplegar en AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name Notion_cuentas \
            --zip-file fileb://target/Lambda_for_finanzas-1.0-SNAPSHOT.jar
